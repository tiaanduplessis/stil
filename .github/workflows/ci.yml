name: CI

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/**'
      - 'scripts/**'
  workflow_dispatch:
    inputs:
      full_device_matrix:
        description: Test both the minimum and target Android versions
        type: boolean
        default: false
  workflow_call:
    inputs:
      ref:
        description: Exact source commit to verify
        required: true
        type: string
      full_device_matrix:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  quality:
    name: Build, unit tests, lint
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Install pinned Android SDK components
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools platforms;android-36 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - name: Build APKs, run unit tests and lint
        run: >-
          ./gradlew :app:assembleDebug :app:assembleRelease
          :app:testDebugUnitTest :app:lintDebug
          --no-daemon --max-workers=1 --no-parallel --console=plain
      - name: Test release signing and failure paths with a disposable key
        env:
          STIL_TEST_APK: app/build/outputs/apk/release/app-release-unsigned.apk
        run: |
          export ANDROID_BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          python3 -m unittest discover -s scripts/tests -v
      - name: Upload test APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stil-debug-${{ github.run_id }}-${{ github.run_attempt }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload build reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 7

  emulator:
    name: Android ${{ matrix.api }} tests
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        api: ${{ fromJSON(inputs.full_device_matrix && '[26,36]' || '[36]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install pinned Android SDK components
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools platforms;android-36 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - name: Build device tests before starting emulator
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --max-workers=1 --no-parallel --console=plain
      - name: Reserve disk space for the test emulator
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift "$ANDROID_HOME/ndk"
          df -h "$HOME"
      - name: Run device tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_4
          cores: 2
          ram-size: 2560M
          emulator-boot-timeout: 300
          disable-animations: false
          enable-hw-keyboard: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -skin 720x1600 -dpi-device 280
          pre-emulator-launch-script: |
            python3 - <<'PY'
            from pathlib import Path
            import shutil
            free = shutil.disk_usage(Path.home()).free
            required = 10 * 1024 ** 3
            print(f"Emulator disk space: {free / 1024 ** 3:.1f} GiB free")
            if free < required:
                raise SystemExit("At least 10 GiB free is required for the Android test emulator")
            PY
          script: |
            mkdir -p .artifacts/emulator
            adb logcat -c
            adb logcat -v threadtime > .artifacts/emulator/logcat.txt &
            logcat_pid=$!
            trap 'adb exec-out screencap -p > .artifacts/emulator/final-screen.png; kill "$logcat_pid" || true' EXIT
            ./gradlew :app:connectedDebugAndroidTest --no-daemon --max-workers=1 --no-parallel --console=plain
      - name: Upload device reports and diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-${{ matrix.api }}-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            .artifacts/emulator/
          include-hidden-files: true
          retention-days: 7
