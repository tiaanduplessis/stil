name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag on main, such as v0.1.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: stil-release
  cancel-in-progress: false

jobs:
  source:
    name: Validate release source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the tag to a commit on main
        id: source
        env:
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$GITHUB_REF" == refs/heads/main ]] || { echo 'Run this workflow from main.'; exit 1; }
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]] || { echo 'Invalid version tag.'; exit 1; }
          commit=$(git rev-parse --verify "refs/tags/$TAG^{commit}")
          git merge-base --is-ancestor "$commit" origin/main || { echo 'The tag must be on main.'; exit 1; }
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify tagged source
    needs: source
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.source.outputs.commit }}
      full_device_matrix: true

  release:
    name: Sign and create draft release
    needs: [source, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - name: Check signing configuration
        env:
          STIL_KEYSTORE_BASE64: ${{ secrets.STIL_KEYSTORE_BASE64 }}
          STIL_KEYSTORE_PASSWORD: ${{ secrets.STIL_KEYSTORE_PASSWORD }}
          STIL_KEY_ALIAS: ${{ secrets.STIL_KEY_ALIAS }}
          STIL_KEY_PASSWORD: ${{ secrets.STIL_KEY_PASSWORD }}
          STIL_SIGNING_CERT_SHA256: ${{ vars.STIL_SIGNING_CERT_SHA256 }}
        run: |
          for name in STIL_KEYSTORE_BASE64 STIL_KEYSTORE_PASSWORD STIL_KEY_ALIAS STIL_KEY_PASSWORD STIL_SIGNING_CERT_SHA256; do
            [[ -n "${!name}" ]] || { echo "Configure $name in the release environment first."; exit 1; }
          done
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true
      - name: Install pinned Android SDK components
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools platforms;android-36 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - name: Build minified release APK
        run: ./gradlew :app:assembleRelease --no-daemon --max-workers=1 --no-parallel --console=plain
      - name: Sign APK and verify identity and version
        env:
          TAG: ${{ inputs.tag }}
          SOURCE_COMMIT: ${{ needs.source.outputs.commit }}
          STIL_KEYSTORE_BASE64: ${{ secrets.STIL_KEYSTORE_BASE64 }}
          STIL_KEYSTORE_PASSWORD: ${{ secrets.STIL_KEYSTORE_PASSWORD }}
          STIL_KEY_ALIAS: ${{ secrets.STIL_KEY_ALIAS }}
          STIL_KEY_PASSWORD: ${{ secrets.STIL_KEY_PASSWORD }}
          STIL_SIGNING_CERT_SHA256: ${{ vars.STIL_SIGNING_CERT_SHA256 }}
        run: >-
          python3 scripts/prepare_release.py
          --apk app/build/outputs/apk/release/app-release-unsigned.apk
          --tag "$TAG" --commit "$SOURCE_COMMIT"
          --build-tools "$ANDROID_HOME/build-tools/35.0.0"
          --output .artifacts/release
      - name: Retain verified files and obfuscation mapping
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-${{ inputs.tag }}-${{ github.run_id }}
          path: |
            .artifacts/release/
            app/build/outputs/mapping/release/mapping.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          SOURCE_COMMIT: ${{ needs.source.outputs.commit }}
        run: |
          remote_commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)
          [[ "$remote_commit" == "$SOURCE_COMMIT" ]] || { echo 'The tag moved during verification.'; exit 1; }
          gh release create "$TAG" .artifacts/release/*.apk .artifacts/release/SHA256SUMS .artifacts/release/release.json app/build/outputs/mapping/release/mapping.txt \
            --verify-tag --draft --title "Stil $TAG" --generate-notes
          echo "Draft release prepared for $TAG at $SOURCE_COMMIT. Review and publish it manually." >> "$GITHUB_STEP_SUMMARY"
